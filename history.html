<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libra – Reading History</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .view {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        /* ── Stats row ── */
        .history-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        @media(max-width:900px) {
            .history-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .history-stat {
            background: var(--card-bg, #1e293b);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 22px;
            transition: transform .2s, box-shadow .2s;
        }

        .history-stat:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
        }

        .history-stat .val {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 2px;
        }

        .history-stat .lbl {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* ── Filter / search bar ── */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-btn {
            padding: 8px 18px;
            border-radius: 50px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ── Student card list ── */
        .history-card-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px 22px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: border-color .2s, transform .2s;
        }

        .history-card:hover {
            border-color: rgba(99, 102, 241, .4);
            transform: translateX(3px);
        }

        .history-card.overdue-card {
            border-color: rgba(239, 68, 68, .3);
            background: rgba(239, 68, 68, .04);
        }

        .history-card.returned-card {
            opacity: .8;
        }

        .hc-icon {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .hc-icon.issue {
            background: rgba(99, 102, 241, .15);
            color: #818cf8;
        }

        .hc-icon.returned {
            background: rgba(74, 222, 128, .15);
            color: #4ade80;
        }

        .hc-icon.overdue {
            background: rgba(239, 68, 68, .15);
            color: #f87171;
        }

        .hc-body {
            flex: 1;
            min-width: 0;
        }

        .hc-body h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hc-body .hc-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .hc-body .hc-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .hc-right {
            text-align: right;
            flex-shrink: 0;
        }

        .hc-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .3px;
            margin-bottom: 6px;
        }

        .hc-status-badge.active {
            background: rgba(99, 102, 241, .15);
            color: #818cf8;
        }

        .hc-status-badge.returned {
            background: rgba(74, 222, 128, .15);
            color: #4ade80;
        }

        .hc-status-badge.warning {
            background: rgba(245, 158, 11, .15);
            color: #fbbf24;
        }

        .hc-status-badge.overdue {
            background: rgba(239, 68, 68, .15);
            color: #f87171;
        }

        .hc-return-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* ── COVER MINI ── */
        .hc-cover {
            width: 46px;
            height: 60px;
            border-radius: 6px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .hc-cover .book-cover {
            width: 100%;
            height: 100%;
            border-radius: 6px;
        }

        /* ── Empty state ── */
        .history-empty {
            text-align: center;
            padding: 60px 24px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
        }

        .history-empty i {
            font-size: 48px;
            opacity: .35;
            display: block;
            margin-bottom: 14px;
        }

        .history-empty h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .history-empty p {
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar (student + librarian links) -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-book-open"></i>
                <span>Libra</span>
            </div>
            <nav class="nav-menu" id="sidebar-nav">
                <!-- populated by JS based on role -->
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-history" placeholder="Search by title or author…">
                </div>
                <div class="header-actions">
                    <div class="user-profile">
                        <img id="header-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff"
                            alt="Avatar" class="avatar">
                        <div class="user-info">
                            <span class="user-name" id="header-name">—</span>
                            <span class="user-role" id="header-role">—</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-area">
                <div class="view active">

                    <!-- Banner -->
                    <div class="admin-banner" style="margin-bottom:28px;background-color:var(--primary,#0056b3);">
                        <div class="admin-badge" style="background:rgba(255,255,255,.15);color:#bfdbfe;">
                            <i class="fa-solid fa-clock-rotate-left"></i> History
                        </div>
                        <h1 id="banner-title">Reading History</h1>
                        <p id="banner-sub">All books you have borrowed — active and returned.</p>
                    </div>

                    <!-- Stats -->
                    <div class="history-stats">
                        <div class="history-stat">
                            <div class="val" id="hs-total" style="color:var(--primary);">—</div>
                            <div class="lbl">Total Borrows</div>
                        </div>
                        <div class="history-stat">
                            <div class="val" id="hs-active" style="color:#f59e0b;">—</div>
                            <div class="lbl">Currently Active</div>
                        </div>
                        <div class="history-stat">
                            <div class="val" id="hs-returned" style="color:#4ade80;">—</div>
                            <div class="lbl">Returned</div>
                        </div>
                        <div class="history-stat">
                            <div class="val" id="hs-overdue" style="color:#f87171;">—</div>
                            <div class="lbl">Overdue</div>
                        </div>
                    </div>

                    <!-- Filter -->
                    <div class="filter-bar">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="returned">Returned</button>
                        <button class="filter-btn" data-filter="overdue">Overdue</button>
                        <button class="filter-btn" id="btn-refresh-history" style="margin-left:auto;">
                            <i class="fa-solid fa-rotate-right"></i> Refresh
                        </button>
                    </div>

                    <!-- ── STUDENT: card list ── -->
                    <div id="student-history-area">
                        <div class="history-card-list" id="history-card-list">
                            <div class="history-empty">
                                <i class="fa-solid fa-spinner fa-spin"></i>
                                <h3>Loading…</h3>
                            </div>
                        </div>
                    </div>

                    <!-- ── LIBRARIAN: table view ── -->
                    <div id="librarian-history-area" style="display:none;">
                        <div class="admin-table-container">
                            <div class="admin-table-header">
                                <h2><i class="fa-solid fa-receipt"></i> All Transactions</h2>
                            </div>
                            <table class="admin-table">
                                <thead>
                                    <tr>
                                        <th>Type</th>
                                        <th>Book</th>
                                        <th>Student</th>
                                        <th>Issued</th>
                                        <th>Due Date</th>
                                        <th>Returned</th>
                                        <th>Status</th>
                                        <th>Issued By</th>
                                    </tr>
                                </thead>
                                <tbody id="history-tbody">
                                    <tr>
                                        <td colspan="8" class="empty-loans-message"><i
                                                class="fa-solid fa-spinner fa-spin"></i> Loading…</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        const API = 'http://localhost:3000';
        const token = localStorage.getItem('libra_token');
        const userStr = localStorage.getItem('libra_user');
        if (!token || !userStr) { window.location.href = 'login.html'; }
        const user = JSON.parse(userStr);
        const isLibrarian = user.role === 'librarian';

        // Header
        document.getElementById('header-name').textContent = user.name || '—';
        document.getElementById('header-role').textContent = isLibrarian ? 'Librarian' : 'Student';
        if (user.photoURL) document.getElementById('header-avatar').src = user.photoURL;
        else document.getElementById('header-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=6366f1&color=fff`;

        // Sidebar
        const sidebarNav = document.getElementById('sidebar-nav');
        if (isLibrarian) {
            sidebarNav.innerHTML = `
                <a href="index.html" class="nav-item"><i class="fa-solid fa-border-all"></i><span>Dashboard</span></a>
                <a href="manage-books.html" class="nav-item"><i class="fa-solid fa-swatchbook"></i><span>Manage Books</span></a>
                <a href="manage-users.html" class="nav-item"><i class="fa-solid fa-users"></i><span>Manage Users</span></a>
                <a href="history.html" class="nav-item active"><i class="fa-solid fa-clock-rotate-left"></i><span>Transactions</span></a>
                <div class="divider"></div>
                <a href="login.html" class="nav-item logout"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Log Out</span></a>`;
            document.getElementById('banner-title').textContent = 'Transaction History';
            document.getElementById('banner-sub').textContent = 'Complete log of all book issues and returns across all students.';
        } else {
            sidebarNav.innerHTML = `
                <a href="index.html" class="nav-item"><i class="fa-solid fa-border-all"></i><span>Dashboard</span></a>
                <a href="my-books.html" class="nav-item"><i class="fa-solid fa-book-bookmark"></i><span>My Books</span></a>
                <a href="history.html" class="nav-item active"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a>
                <a href="fines.html" class="nav-item"><i class="fa-solid fa-file-invoice-dollar"></i><span>Fines & Payments</span></a>
                <a href="wishlist.html" class="nav-item"><i class="fa-solid fa-heart"></i><span>Wishlist</span></a>
                <div class="divider"></div>
                <a href="login.html" class="nav-item logout"><i class="fa-solid fa-arrow-right-from-bracket"></i><span>Log Out</span></a>`;
        }

        // Logout
        document.querySelectorAll('.nav-item.logout').forEach(el => {
            el.addEventListener('click', e => {
                e.preventDefault();
                localStorage.removeItem('libra_user');
                localStorage.removeItem('libra_token');
                window.location.href = 'login.html';
            });
        });

        let allHistory = [];
        const coverClasses = ['placeholder-cover-1', 'placeholder-cover-2', 'rec-1', 'rec-2', 'rec-3'];
        function pseudoCover(title) {
            let h = 0;
            for (let i = 0; i < title.length; i++) h = (h * 31 + title.charCodeAt(i)) & 0xffffffff;
            return coverClasses[Math.abs(h) % coverClasses.length];
        }

        function fmtDate(iso) {
            return new Date(iso).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        // ── UPDATE STATS ──
        function updateStats(items) {
            const today = new Date();
            const active = items.filter(h => !h.returned);
            const returned = items.filter(h => h.returned);
            const overdue = active.filter(h => new Date(h.dueDate) < today);
            document.getElementById('hs-total').textContent = items.length;
            document.getElementById('hs-active').textContent = active.length;
            document.getElementById('hs-returned').textContent = returned.length;
            document.getElementById('hs-overdue').textContent = overdue.length;
        }

        // ── STUDENT CARD RENDER ──
        function renderStudentCards(items) {
            const list = document.getElementById('history-card-list');
            if (items.length === 0) {
                list.innerHTML = `
                    <div class="history-empty">
                        <i class="fa-solid fa-book-open"></i>
                        <h3>No matching records</h3>
                        <p>Try a different filter or borrow your first book from the dashboard!</p>
                    </div>`;
                return;
            }
            list.innerHTML = '';
            const today = new Date();
            items.forEach(h => {
                const daysLeft = Math.ceil((new Date(h.dueDate) - today) / (1000 * 60 * 60 * 24));
                const isOverdue = !h.returned && daysLeft < 0;
                const isDueSoon = !h.returned && daysLeft >= 0 && daysLeft <= 3;

                let iconClass, cardClass, statusBadge;
                if (h.returned) {
                    iconClass = 'returned'; cardClass = 'returned-card';
                    statusBadge = `<span class="hc-status-badge returned"><i class="fa-solid fa-check"></i> Returned</span>`;
                } else if (isOverdue) {
                    iconClass = 'overdue'; cardClass = 'overdue-card';
                    statusBadge = `<span class="hc-status-badge overdue"><i class="fa-solid fa-triangle-exclamation"></i> Overdue ${Math.abs(daysLeft)}d</span>`;
                } else if (isDueSoon) {
                    iconClass = 'issue'; cardClass = '';
                    statusBadge = `<span class="hc-status-badge warning"><i class="fa-regular fa-clock"></i> Due in ${daysLeft}d</span>`;
                } else {
                    iconClass = 'issue'; cardClass = '';
                    statusBadge = `<span class="hc-status-badge active"><i class="fa-solid fa-book-open-reader"></i> Active · ${daysLeft}d left</span>`;
                }

                const iconSymbol = h.returned ? 'fa-rotate-left' : (isOverdue ? 'fa-triangle-exclamation' : 'fa-arrow-right');
                const returnedLine = h.returned && h.returnDate
                    ? `<span class="hc-return-date">Returned on ${fmtDate(h.returnDate)}</span>`
                    : '';

                const coverClass = pseudoCover(h.bookTitle);
                list.insertAdjacentHTML('beforeend', `
                    <div class="history-card ${cardClass}">
                        <div class="hc-cover"><div class="book-cover ${coverClass}"></div></div>
                        <div class="hc-body">
                            <h4>${h.bookTitle}</h4>
                            <div class="hc-meta">
                                <span><i class="fa-solid fa-pen-nib"></i> ${h.bookAuthor}</span>
                                <span><i class="fa-solid fa-calendar-days"></i> Borrowed ${fmtDate(h.borrowDate)}</span>
                                <span><i class="fa-regular fa-calendar-xmark"></i> Due ${fmtDate(h.dueDate)}</span>
                                ${h.issuedBy !== 'Self' ? `<span><i class="fa-solid fa-user-tie"></i> Issued by Librarian</span>` : ''}
                            </div>
                        </div>
                        <div class="hc-right">
                            ${statusBadge}
                            ${returnedLine}
                        </div>
                    </div>
                `);
            });
        }

        // ── LIBRARIAN TABLE RENDER ──
        function renderLibrarianTable(items) {
            const tbody = document.getElementById('history-tbody');
            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="empty-loans-message"><i class="fa-solid fa-filter"></i><br>No matching transactions.</td></tr>';
                return;
            }
            const today = new Date();
            tbody.innerHTML = '';
            items.forEach(h => {
                const returndDate = h.returnDate ? fmtDate(h.returnDate) : '—';
                const daysLeft = Math.ceil((new Date(h.dueDate) - today) / (1000 * 60 * 60 * 24));
                const isOverdue = !h.returned && daysLeft < 0;
                let typeIcon = h.returned
                    ? '<span style="background:#d1fae5;color:#065f46;padding:5px 11px;border-radius:50px;font-size:12px;font-weight:600;"><i class="fa-solid fa-rotate-left"></i> Return</span>'
                    : '<span style="background:#e0e7ff;color:#4338ca;padding:5px 11px;border-radius:50px;font-size:12px;font-weight:600;"><i class="fa-solid fa-arrow-right"></i> Issue</span>';
                let statusBadge = h.returned
                    ? '<span class="loan-status-badge active">✓ Returned</span>'
                    : isOverdue
                        ? `<span class="loan-status-badge overdue">⚠ Overdue ${Math.abs(daysLeft)}d</span>`
                        : daysLeft <= 3
                            ? `<span class="loan-status-badge warning">Due in ${daysLeft}d</span>`
                            : `<span class="loan-status-badge active">Active · ${daysLeft}d</span>`;
                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="${isOverdue ? 'overdue-row' : ''}" ${h.returned ? 'style="opacity:.7;"' : ''}>
                        <td>${typeIcon}</td>
                        <td class="loan-book-info"><strong>${h.bookTitle}</strong><span>${h.bookAuthor}</span></td>
                        <td><div style="font-weight:600;font-size:14px;">${h.studentName}</div><div style="font-size:12px;color:var(--text-muted);">${h.studentEmail}</div></td>
                        <td style="font-size:13px;">${fmtDate(h.borrowDate)}</td>
                        <td style="font-size:13px;">${fmtDate(h.dueDate)}</td>
                        <td style="font-size:13px;">${returndDate}</td>
                        <td>${statusBadge}</td>
                        <td style="font-size:12px;color:var(--text-muted);">${h.issuedBy === 'Self' ? '👤 Self' : '📋 ' + h.issuedBy}</td>
                    </tr>
                `);
            });
        }

        // ── LOAD HISTORY ──
        async function loadHistory() {
            const endpoint = isLibrarian ? `${API}/api/history` : `${API}/api/student/history`;
            if (isLibrarian) {
                document.getElementById('student-history-area').style.display = 'none';
                document.getElementById('librarian-history-area').style.display = 'block';
                document.getElementById('history-tbody').innerHTML = '<tr><td colspan="8" class="empty-loans-message"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</td></tr>';
            } else {
                document.getElementById('student-history-area').style.display = 'block';
                document.getElementById('librarian-history-area').style.display = 'none';
                document.getElementById('history-card-list').innerHTML = '<div class="history-empty"><i class="fa-solid fa-spinner fa-spin"></i><h3>Loading…</h3></div>';
            }

            try {
                const res = await fetch(endpoint, { headers: { 'Authorization': `Bearer ${token}` } });
                const data = await res.json();
                if (!data.success) throw new Error(data.message);
                allHistory = data.history;
                updateStats(allHistory);
                if (isLibrarian) renderLibrarianTable(allHistory);
                else renderStudentCards(allHistory);
            } catch (e) {
                const msg = `<div class="history-empty"><i class="fa-solid fa-circle-exclamation" style="color:var(--danger);"></i><h3>Could not load history</h3><p>Make sure the server is running.</p></div>`;
                if (isLibrarian) document.getElementById('history-tbody').innerHTML = `<tr><td colspan="8" class="empty-loans-message">${msg}</td></tr>`;
                else document.getElementById('history-card-list').innerHTML = msg;
            }
        }

        // ── FILTER BUTTONS ──
        document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn[data-filter]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.dataset.filter;
                const today = new Date();
                let filtered = allHistory;
                if (filter === 'active') filtered = allHistory.filter(h => !h.returned);
                if (filter === 'returned') filtered = allHistory.filter(h => h.returned);
                if (filter === 'overdue') filtered = allHistory.filter(h => !h.returned && new Date(h.dueDate) < today);
                if (isLibrarian) renderLibrarianTable(filtered);
                else renderStudentCards(filtered);
            });
        });

        // ── SEARCH ──
        document.getElementById('search-history').addEventListener('input', function () {
            const q = this.value.toLowerCase().trim();
            if (!q) { if (isLibrarian) renderLibrarianTable(allHistory); else renderStudentCards(allHistory); return; }
            const filtered = allHistory.filter(h =>
                h.bookTitle.toLowerCase().includes(q) ||
                h.bookAuthor.toLowerCase().includes(q) ||
                (h.studentName || '').toLowerCase().includes(q) ||
                (h.studentEmail || '').toLowerCase().includes(q)
            );
            if (isLibrarian) renderLibrarianTable(filtered);
            else renderStudentCards(filtered);
        });

        document.getElementById('btn-refresh-history').addEventListener('click', loadHistory);

        loadHistory();
    </script>
</body>

</html>
