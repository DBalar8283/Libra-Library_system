<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libra - Manage Books</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .view {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-book-open"></i>
                <span>Libra</span>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="nav-item">
                    <i class="fa-solid fa-border-all"></i>
                    <span>Dashboard</span>
                </a>
                <a href="manage-books.html" class="nav-item active">
                    <i class="fa-solid fa-swatchbook"></i>
                    <span>Manage Books</span>
                </a>
                <a href="manage-users.html" class="nav-item">
                    <i class="fa-solid fa-users"></i>
                    <span>Manage Users</span>
                </a>
                <div class="divider"></div>
                <a href="index.html" class="nav-item">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
                <a href="login.html" class="nav-item logout" id="sidebar-logout">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Log Out</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-books-input" placeholder="Search books by title or author...">
                </div>
                <div class="header-actions">
                    <button class="icon-btn" onclick="window.location.href='index.html'">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                </div>
            </header>

            <div class="content-area">
                <div class="view active">

                    <!-- Page Header -->
                    <div class="admin-banner" style="margin-bottom: 28px;">
                        <div class="admin-badge"><i class="fa-solid fa-swatchbook"></i> Book Management</div>
                        <h1>Manage Library Catalog</h1>
                        <p>Add, edit, and manage all books in your library collection.</p>
                    </div>

                    <!-- Add Book Form -->
                    <div class="admin-issue-panel" id="add-book-panel">
                        <div class="panel-header">
                            <h3><i class="fa-solid fa-book-medical" style="color: var(--primary);"></i> Add New Book
                            </h3>
                        </div>
                        <div style="display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 16px; align-items: end;"
                            class="admin-form-grid">
                            <div>
                                <label>Book Title</label>
                                <input type="text" id="add-title" placeholder="e.g. The Great Gatsby">
                            </div>
                            <div>
                                <label>Author</label>
                                <input type="text" id="add-author" placeholder="e.g. F. Scott Fitzgerald">
                            </div>
                            <div>
                                <label>Copies</label>
                                <input type="number" id="add-copies" value="1" min="1" style="width: 100%;">
                            </div>
                            <button id="btn-add-book-page" class="btn btn-primary"
                                style="padding: 12px 28px; height: fit-content;">
                                <i class="fa-solid fa-plus"></i> Add Book
                            </button>
                        </div>
                        <p id="add-book-msg"
                            style="margin-top: 12px; font-size: 13px; font-weight: 500; display: none;"></p>
                    </div>

                    <!-- Book Catalog Table -->
                    <div class="admin-table-container">
                        <div class="admin-table-header">
                            <h2><i class="fa-solid fa-book-open"></i> Library Catalog (<span id="book-count">0</span>
                                titles)</h2>
                            <button id="btn-refresh-books" class="btn btn-outline btn-sm"><i
                                    class="fa-solid fa-rotate-right"></i> Refresh</button>
                        </div>
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Author</th>
                                    <th>Total Copies</th>
                                    <th>Available</th>
                                    <th>Issued</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="books-tbody">
                                <tr>
                                    <td colspan="7" class="empty-loans-message"><i
                                            class="fa-solid fa-spinner fa-spin"></i> Loading catalog...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Edit Book Modal Overlay -->
                    <div id="edit-modal"
                        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; align-items:center; justify-content:center;">
                        <div
                            style="background: var(--bg-card); border-radius: var(--radius-lg); padding: 32px; max-width: 480px; width: 90%; box-shadow: var(--shadow-lg);">
                            <h3 style="margin-bottom: 20px; font-size: 20px;"><i class="fa-solid fa-pen-to-square"
                                    style="color: var(--primary);"></i> Edit Book</h3>
                            <input type="hidden" id="edit-book-id">
                            <div style="display: flex; flex-direction: column; gap: 14px;">
                                <div>
                                    <label
                                        style="font-size: 13px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Title</label>
                                    <input type="text" id="edit-title"
                                        style="width:100%; padding:12px 16px; border-radius:var(--radius-md); border:1px solid var(--border); font-size:14px; font-family:inherit; box-sizing:border-box;">
                                </div>
                                <div>
                                    <label
                                        style="font-size: 13px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Author</label>
                                    <input type="text" id="edit-author"
                                        style="width:100%; padding:12px 16px; border-radius:var(--radius-md); border:1px solid var(--border); font-size:14px; font-family:inherit; box-sizing:border-box;">
                                </div>
                                <div>
                                    <label
                                        style="font-size: 13px; color: var(--text-muted); font-weight: 600; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Total
                                        Copies</label>
                                    <input type="number" id="edit-copies" min="1"
                                        style="width:100%; padding:12px 16px; border-radius:var(--radius-md); border:1px solid var(--border); font-size:14px; font-family:inherit; box-sizing:border-box;">
                                </div>
                                <p id="edit-msg" style="font-size: 13px; font-weight: 500; display: none;"></p>
                                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px;">
                                    <button id="btn-cancel-edit" class="btn btn-outline"
                                        style="padding: 10px 20px;">Cancel</button>
                                    <button id="btn-save-edit" class="btn btn-primary" style="padding: 10px 24px;">Save
                                        Changes</button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script>
        const API = 'http://localhost:3000';
        const token = localStorage.getItem('libra_token');
        const user = JSON.parse(localStorage.getItem('libra_user') || 'null');

        // Auth guard
        if (!user || user.role !== 'librarian' || !token) {
            alert('Librarian access required.');
            window.location.href = 'login.html';
        }

        // Logout
        document.getElementById('sidebar-logout')?.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('libra_user');
            localStorage.removeItem('libra_token');
            window.location.href = 'login.html';
        });

        // Load books
        async function loadBooks() {
            const tbody = document.getElementById('books-tbody');
            tbody.innerHTML = '<tr><td colspan="7" class="empty-loans-message"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</td></tr>';

            try {
                const res = await fetch(`${API}/api/books`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                document.getElementById('book-count').innerText = data.books.length;

                if (!data.success || data.books.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-loans-message"><i class="fa-solid fa-inbox"></i><br>No books in the catalog yet.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                data.books.forEach(b => {
                    const issued = b.totalCopies - b.available;
                    const availClass = b.available === 0 ? 'loan-status-badge overdue' : b.available <= 2 ? 'loan-status-badge warning' : 'loan-status-badge active';
                    tbody.insertAdjacentHTML('beforeend', `
                        <tr>
                            <td style="font-size:12px; color:var(--text-muted); font-family:monospace;">${b.id}</td>
                            <td><strong>${b.title}</strong></td>
                            <td>${b.author}</td>
                            <td style="text-align:center;">${b.totalCopies}</td>
                            <td style="text-align:center;"><span class="${availClass}">${b.available}</span></td>
                            <td style="text-align:center;">${issued}</td>
                            <td>
                                <button class="btn btn-outline btn-sm" onclick="openEditModal('${b.id}','${b.title.replace(/'/g, "\\'")}','${b.author.replace(/'/g, "\\'")}', ${b.totalCopies})" style="margin-right:6px;">
                                    <i class="fa-solid fa-pen"></i> Edit
                                </button>
                                <button class="btn btn-outline btn-sm" onclick="deleteBook('${b.id}')" style="color:var(--danger); border-color:var(--danger);">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `);
                });
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-loans-message" style="color:var(--danger)"><i class="fa-solid fa-circle-exclamation"></i><br>Could not load books.</td></tr>';
            }
        }

        // Add book
        document.getElementById('btn-add-book-page').addEventListener('click', async () => {
            const title = document.getElementById('add-title').value.trim();
            const author = document.getElementById('add-author').value.trim();
            const totalCopies = document.getElementById('add-copies').value;
            const msg = document.getElementById('add-book-msg');

            if (!title || !author) {
                msg.style.display = 'block'; msg.style.color = 'var(--danger)'; msg.innerText = 'Title and author are required.';
                return;
            }

            try {
                const res = await fetch(`${API}/api/books/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ title, author, totalCopies })
                });
                const data = await res.json();
                msg.style.display = 'block';
                msg.style.color = data.success ? 'var(--secondary)' : 'var(--danger)';
                msg.innerText = data.message;
                if (data.success) {
                    document.getElementById('add-title').value = '';
                    document.getElementById('add-author').value = '';
                    document.getElementById('add-copies').value = '1';
                    loadBooks();
                }
            } catch (e) { msg.style.display = 'block'; msg.style.color = 'var(--danger)'; msg.innerText = 'Server error.'; }
        });

        // Delete book
        async function deleteBook(bookId) {
            if (!confirm('Are you sure you want to delete this book?')) return;
            try {
                const res = await fetch(`${API}/api/books/${bookId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) loadBooks();
            } catch (e) { alert('Server error.'); }
        }

        // Edit modal
        function openEditModal(id, title, author, copies) {
            document.getElementById('edit-book-id').value = id;
            document.getElementById('edit-title').value = title;
            document.getElementById('edit-author').value = author;
            document.getElementById('edit-copies').value = copies;
            document.getElementById('edit-msg').style.display = 'none';
            document.getElementById('edit-modal').style.display = 'flex';
        }

        document.getElementById('btn-cancel-edit').addEventListener('click', () => {
            document.getElementById('edit-modal').style.display = 'none';
        });

        document.getElementById('btn-save-edit').addEventListener('click', async () => {
            const bookId = document.getElementById('edit-book-id').value;
            const title = document.getElementById('edit-title').value.trim();
            const author = document.getElementById('edit-author').value.trim();
            const totalCopies = document.getElementById('edit-copies').value;
            const msg = document.getElementById('edit-msg');

            try {
                const res = await fetch(`${API}/api/books/${bookId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ title, author, totalCopies })
                });
                const data = await res.json();
                msg.style.display = 'block';
                msg.style.color = data.success ? 'var(--secondary)' : 'var(--danger)';
                msg.innerText = data.message;
                if (data.success) {
                    setTimeout(() => {
                        document.getElementById('edit-modal').style.display = 'none';
                        loadBooks();
                    }, 800);
                }
            } catch (e) { msg.style.display = 'block'; msg.style.color = 'var(--danger)'; msg.innerText = 'Server error.'; }
        });

        // Search filter
        document.getElementById('search-books-input').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#books-tbody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(q) ? '' : 'none';
            });
        });

        // Refresh
        document.getElementById('btn-refresh-books').addEventListener('click', () => loadBooks());

        // Initial load
        loadBooks();
    </script>
</body>

</html>
