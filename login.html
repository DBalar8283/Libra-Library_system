<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libra – Library System</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDonXCdDnV7P0maXDdB1eNpCgKi8Apvab0",
            authDomain: "libraweb-b8042.firebaseapp.com",
            projectId: "libraweb-b8042",
            storageBucket: "libraweb-b8042.firebasestorage.app",
            messagingSenderId: "69912401460",
            appId: "1:69912401460:web:dc89fbe7224bc9ad1d1c61",
            measurementId: "G-2CV3Q3433N"
        };
        firebase.initializeApp(firebaseConfig);
    </script>

    <style>
        /* ─── RESET & BASE ─────────────────────────────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body.login-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            background: #f4f6f9;
        }

        /* ─── PARTICLE CANVAS ──────────────────────────────── */
        #particle-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* ─── FLOATING BG ICONS ────────────────────────────── */
        .bg-books {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-book {
            position: absolute;
            color: rgba(0, 86, 179, 0.06);
            animation: driftBook linear infinite;
        }

        @keyframes driftBook {
            0% {
                transform: translateY(110vh) rotate(-12deg);
                opacity: 0;
            }

            8% {
                opacity: 1;
            }

            92% {
                opacity: 1;
            }

            100% {
                transform: translateY(-12vh) rotate(12deg);
                opacity: 0;
            }
        }

        /* ─── SCENE WRAPPER ────────────────────────────────── */
        .scene-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        /* ─── HERO LABEL (above book) ──────────────────────── */
        .hero-label {
            text-align: center;
            margin-bottom: 32px;
            animation: fadeSlideDown 0.7s ease both;
        }

        .hero-label h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #0056b3;
            text-transform: uppercase;
        }

        .hero-label p {
            font-size: 13px;
            letter-spacing: 3px;
            color: rgba(0, 86, 179, 0.55);
            text-transform: uppercase;
            margin-top: 6px;
        }

        @keyframes fadeSlideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ─── BOOK SCENE ──────────────────────────────────── */
        .book-scene {
            perspective: 1800px;
            perspective-origin: 50% 45%;
        }

        /* The book root — shifted right so opened cover has space on left */
        .book-3d {
            width: 340px;
            height: 500px;
            position: relative;
            transform-style: preserve-3d;
            animation: floatBook 5s ease-in-out infinite;
            transition: transform 1.1s cubic-bezier(0.34, 1.05, 0.64, 1);
        }

        @keyframes floatBook {

            0%,
            100% {
                transform: translateY(0px) rotateY(-6deg);
            }

            50% {
                transform: translateY(-14px) rotateY(-6deg);
            }
        }

        .book-3d.is-open {
            animation: none;
            transform: translateY(-6px) rotateY(0deg);
        }

        /* ─── BOOK SPINE (left strip) ─────────────────────── */
        .book-spine {
            position: absolute;
            width: 28px;
            height: 100%;
            left: 0;
            top: 0;
            background: #004494;
            transform: translateX(-28px) rotateY(90deg);
            transform-origin: right center;
            border-radius: 4px 0 0 4px;
            box-shadow: inset -4px 0 10px rgba(0, 0, 0, 0.45), -3px 0 14px rgba(0, 0, 0, 0.3);
            backface-visibility: hidden;
        }

        .book-spine::after {
            content: 'LIBRA';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(180deg);
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 5px;
            color: rgba(255, 255, 255, 0.35);
            writing-mode: vertical-rl;
        }

        /* ─── BACK COVER ──────────────────────────────────── */
        .book-cover-back {
            position: absolute;
            inset: 0;
            background: #0056b3;
            transform: translateZ(-26px);
            border-radius: 0 4px 4px 0;
            box-shadow: -2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* ─── PAGES STACK ─────────────────────────────────── */
        .book-pages {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
        }

        .page-stack {
            position: absolute;
            inset: 0;
            background: #f8f9fa;
            border-radius: 0 10px 10px 0;
            transform-origin: left center;
            transition: transform 0.7s ease;
        }

        .page-stack:nth-child(1) {
            box-shadow: inset -6px 0 18px rgba(0, 0, 0, 0.07);
            z-index: 3;
        }

        .page-stack:nth-child(2) {
            background: #eef2f8;
            transform: translateZ(-3px);
            z-index: 2;
        }

        .page-stack:nth-child(3) {
            background: #e5eaf2;
            transform: translateZ(-6px);
            z-index: 1;
        }

        .page-stack:nth-child(4) {
            background: #dde3ed;
            transform: translateZ(-9px);
            z-index: 0;
        }

        /* Ruled lines on top page */
        .page-stack:first-child::before {
            content: '';
            position: absolute;
            inset: 0;
            background: transparent;
            border-radius: inherit;
        }

        /* Page turn fan when opening */
        .book-3d.is-open .page-stack:nth-child(2) {
            transform: translateZ(-3px) rotateY(3deg);
        }

        .book-3d.is-open .page-stack:nth-child(3) {
            transform: translateZ(-6px) rotateY(6deg);
        }

        .book-3d.is-open .page-stack:nth-child(4) {
            transform: translateZ(-9px) rotateY(9deg);
        }

        /* ─── LOGIN PANEL (inside the open pages) ─────────── */
        .login-panel {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 30px 24px;
            gap: 0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease 0.45s;
            overflow: hidden;
        }

        .book-3d.is-open .login-panel {
            opacity: 1;
            pointer-events: auto;
        }

        .login-panel-header {
            text-align: center;
            margin-bottom: 16px;
        }

        .login-panel-header i {
            font-size: 30px;
            color: #2563eb;
            margin-bottom: 8px;
            filter: drop-shadow(0 3px 10px rgba(37, 99, 235, 0.4));
        }

        .login-panel-header h2 {
            font-size: 18px;
            font-weight: 700;
            color: #0f172a;
        }

        .login-panel-header p {
            font-size: 11px;
            color: #64748b;
            margin-top: 3px;
        }

        /* Google button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: #fff;
            color: #3f3f3f;
            border: 1.5px solid #e2e8f0;
            padding: 12px 20px;
            border-radius: 4px;
            font-family: inherit;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .google-btn:hover {
            border-color: #2563eb;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .google-btn img {
            width: 16px;
            height: 16px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            color: #94a3b8;
            font-size: 11px;
            margin: 6px 0 10px;
            width: 100%;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider::before {
            margin-right: 0.5em;
        }

        .divider::after {
            margin-left: 0.5em;
        }

        /* Floating label inputs */
        .form-group {
            margin-bottom: 10px;
            text-align: left;
            width: 100%;
        }

        .floating-label-group {
            position: relative;
        }

        .floating-label-group label {
            position: absolute;
            top: 10px;
            left: 12px;
            font-size: 12px;
            font-weight: 500;
            color: #94a3b8;
            pointer-events: none;
            transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .floating-label-group input:focus~label,
        .floating-label-group input:not(:placeholder-shown)~label {
            top: -8px;
            left: 10px;
            font-size: 10px;
            color: #2563eb;
            background: white;
            padding: 0 4px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: #f8fafc;
            border-radius: 4px;
            font-family: inherit;
            font-size: 14px;
            color: #0f172a;
            transition: all 0.25s ease;
        }

        .form-control::placeholder {
            color: transparent;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563eb;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 13px 20px;
            background: #0056b3;
            color: white;
            border-radius: 4px;
            font-family: inherit;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 86, 179, 0.2);
            margin-top: 4px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.97);
        }

        /* Dev button */
        .btn-dev {
            width: 100%;
            margin-top: 8px;
            padding: 8px 16px;
            border: 1.5px dashed #cbd5e1;
            border-radius: 4px;
            background: transparent;
            font-family: inherit;
            font-weight: 500;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .btn-dev:hover {
            border-color: #2563eb;
            color: #2563eb;
            background: rgba(37, 99, 235, 0.04);
        }

        /* Error */
        #admin-error {
            color: #ef4444;
            margin-top: 6px;
            font-size: 11px;
        }

        /* ─── FRONT COVER (container) ─────────────────────── */
        .book-cover-front {
            position: absolute;
            inset: 0;
            /* Hinge at the left edge (spine) */
            transform-origin: left center;
            transform: translateZ(26px);
            /* A gentle natural open angle when closed */
            transition: transform 1.05s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-style: preserve-3d;
            z-index: 10;
        }

        /* ── OPEN STATE: cover swings fully open to the left ── */
        .book-3d.is-open .book-cover-front {
            transform: translateZ(26px) rotateY(-162deg);
        }

        /* ─── FRONT COVER: OUTSIDE FACE ───────────────────── */
        .cover-outside {
            position: absolute;
            inset: 0;
            background: #0056b3;
            border-radius: 0 12px 12px 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;

            /* Hinge at the left edge (spine) */
            transform-origin: left center;
            transform: translateZ(26px);
            /* A gentle natural open angle when closed */
            transition: transform 1.05s cubic-bezier(0.25, 0.46, 0.45, 0.94);

            box-shadow: 2px 4px 12px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            overflow: hidden;
            cursor: pointer;
        }

        /* Diagonal linen-like texture overlay */
        .cover-outside::before {
            content: '';
            position: absolute;
            inset: 0;
            background: transparent;
            pointer-events: none;
        }

        /* Inner decorative border */
        .cover-outside::after {
            content: '';
            position: absolute;
            inset: 14px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            pointer-events: none;
        }

        /* Hover: slight lift to hint it can be opened */
        .book-cover-front:hover:not(.no-hover) .cover-outside {
            box-shadow: 4px 6px 16px rgba(0, 0, 0, 0.2);
        }

        /* ─── FRONT COVER: INSIDE FACE ────────────────────── */
        .cover-inside {
            position: absolute;
            inset: 0;
            /* Inner cover is usually a plain paper/cardboard color */
            background: #e2e8f5;
            border-radius: 0 12px 12px 0;
            transform: rotateY(180deg);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            box-shadow: inset 2px 0 6px rgba(0, 0, 0, 0.05);
            transition: box-shadow 1.05s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Add the drop shadow to the *inside* face when it swings open */
        .book-3d.is-open .cover-inside {
            box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.15);
        }

        /* ─── THOUGHT PANEL (external — left of book, 2D) ────── */
        .thought-panel {
            position: absolute;
            right: calc(100% + 6px);
            top: 0;
            width: 310px;
            height: 500px;
            background: #0056b3;
            border-radius: 12px 4px 4px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 36px 28px;
            gap: 18px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateX(40px);
            transition: opacity 0.55s ease 0.6s, transform 0.55s cubic-bezier(0.34, 1.05, 0.64, 1) 0.6s;
        }

        .book-scene.book-open .thought-panel {
            opacity: 1;
            transform: translateX(0);
        }

        .thought-icon {
            font-size: 30px;
            color: rgba(255, 255, 255, 0.45);
        }

        .thought-quote {
            font-size: 15px;
            font-style: italic;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.92);
            font-family: Georgia, serif;
            letter-spacing: 0.2px;
        }

        .thought-author {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .thought-divider {
            width: 44px;
            height: 1px;
            background: rgba(255, 255, 255, 0.28);
        }

        /* Cover content */
        .cover-glow-ring {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }

        .cover-icon-main {
            font-size: 52px;
            color: rgba(255, 255, 255, 0.95);
        }

        .cover-title-main {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 8px;
            color: rgba(255, 255, 255, 0.96);
            text-transform: uppercase;
            position: relative;
            z-index: 1;
            text-shadow: none;
        }

        .cover-subtitle-main {
            font-size: 10px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.55);
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .cover-divider {
            width: 60px;
            height: 1.5px;
            background: rgba(255, 255, 255, 0.5);
            position: relative;
            z-index: 1;
        }

        /* ─── ACCESS WEBSITE BUTTON ───────────────────────── */
        .btn-access {
            position: relative;
            z-index: 2;
            padding: 12px 32px;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.45);
            border-radius: 4px;
            font-family: inherit;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
        }

        .btn-access::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.15);
            border-radius: inherit;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-access:hover {
            background: rgba(255, 255, 255, 0.28);
            border-color: rgba(255, 255, 255, 0.75);
            transform: translateY(-3px);
        }

        .btn-access:hover::before {
            opacity: 1;
        }

        .btn-access:active {
            transform: scale(0.96);
        }

        /* Chevron animate on hover */
        .btn-access .chevron {
            transition: transform 0.3s ease;
        }

        .btn-access:hover .chevron {
            transform: translateX(4px);
        }

        /* Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
            transform: scale(0);
        }

        @keyframes rippleAnim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ─── CLOSE BOOK BUTTON ───────────────────────────── */
        .btn-close-book {
            position: absolute;
            bottom: -48px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            padding: 7px 22px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .book-3d.is-open~.btn-close-book,
        .btn-close-book.visible {
            opacity: 1;
            pointer-events: all;
        }

        .btn-close-book:hover {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
        }

        /* ─── HINT ARROW (only on closed state) ──────────── */
        .hint-arrow {
            position: absolute;
            bottom: -52px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 86, 179, 0.4);
            font-size: 22px;
            animation: bounceDown 1.5s ease-in-out infinite;
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .book-3d.is-open~.hint-arrow {
            opacity: 0;
        }

        @keyframes bounceDown {

            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(8px);
            }
        }

        /* ─── GLOWING ORBS (bg decoration) ───────────────── */
        .orb {
            display: none;
        }

        .orb1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            animation-duration: 10s;
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
            bottom: -80px;
            right: -80px;
            animation-duration: 13s;
            animation-delay: -5s;
        }

        .orb3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(14, 165, 233, 0.15) 0%, transparent 70%);
            top: 50%;
            right: 20%;
            animation-duration: 8s;
            animation-delay: -3s;
        }

        @keyframes orbFloat {

            0%,
            100% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(20px, 20px);
            }
        }
    </style>
</head>

<body class="login-body">

    <!-- Background decoration -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <canvas id="particle-canvas"></canvas>
    <div class="bg-books" id="bg-books"></div>

    <!-- Main Scene -->
    <div class="scene-wrapper">

        <!-- Hero label -->
        <div class="hero-label">
            <h1>Libra</h1>
            <p>Your Digital Library Portal</p>
        </div>

        <!-- Book Scene -->
        <div class="book-scene" style="position:relative;">
            <div class="book-3d" id="book3d">

                <!-- Book spine (left 3D edge) -->
                <div class="book-spine"></div>

                <!-- Back cover -->
                <div class="book-cover-back"></div>

                <!-- Pages with login panel inside -->
                <div class="book-pages">
                    <div class="page-stack">
                        <!-- Login options live here -->
                        <div class="login-panel">
                            <div class="login-panel-header">
                                <i class="fa-solid fa-book-open"></i>
                                <h2>Welcome Back</h2>
                                <p>Sign in to access your library</p>
                            </div>

                            <button id="google-login-btn" class="google-btn">
                                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google Logo">
                                Student Sign in with Google
                            </button>

                            <div class="divider">or Staff Login</div>

                            <form id="admin-login-form" style="width:100%;">
                                <div class="form-group">
                                    <div class="floating-label-group">
                                        <input type="email" id="admin-email" class="form-control"
                                            placeholder="admin@library.com" required>
                                        <label for="admin-email">Librarian Email</label>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div class="floating-label-group">
                                        <input type="password" id="admin-password" class="form-control"
                                            placeholder="••••••••" required>
                                        <label for="admin-password">Password</label>
                                    </div>
                                </div>
                                <button type="submit" class="btn-submit" id="admin-login-btn">
                                    <i class="fa-solid fa-lock" style="margin-right:7px;"></i> Access Dashboard
                                </button>
                            </form>

                            <p id="admin-error" style="display:none;"></p>

                            <button id="dev-student-login" class="btn-dev">
                                <i class="fa-solid fa-flask"></i> Test Student Login Config
                            </button>
                        </div>
                    </div>
                    <div class="page-stack"></div>
                    <div class="page-stack"></div>
                    <div class="page-stack"></div>
                </div>

                <!-- Front cover — hinge left edge -->
                <div class="book-cover-front" id="book-cover-front">
                    <!-- OUTSIDE OF COVER -->
                    <div class="cover-outside">
                        <div class="cover-glow-ring">
                            <i class="fa-solid fa-book-open cover-icon-main"></i>
                        </div>
                        <span class="cover-title-main">Libra</span>
                        <div class="cover-divider"></div>
                        <span class="cover-subtitle-main">Library System</span>
                        <button class="btn-access" id="btn-access-website">
                            <i class="fa-solid fa-door-open"></i>
                            Access Website
                            <i class="fa-solid fa-chevron-right chevron"></i>
                        </button>
                    </div>

                    <!-- INSIDE OF COVER -->
                    <div class="cover-inside"></div>
                </div>

            </div>

            <!-- Thought panel (left of book, fades in when open) -->
            <div class="thought-panel">
                <i class="fa-solid fa-quote-left thought-icon"></i>
                <p class="thought-quote" id="thought-quote"></p>
                <div class="thought-divider"></div>
                <span class="thought-author" id="thought-author"></span>
            </div>

            <!-- Hint arrow (outside book-3d so it can fade) -->
            <div class="hint-arrow" id="hint-arrow">
                <i class="fa-solid fa-chevron-down"></i>
            </div>

            <!-- Close book button (outside book-3d) -->
            <button class="btn-close-book" id="btn-close-book">
                <i class="fa-solid fa-book"></i> Close Book
            </button>
        </div>

    </div>

    <script>
        // ─── AUTH REDIRECT ───────────────────────────────────
        (function () {
            const token = localStorage.getItem('libra_token');
            const user = localStorage.getItem('libra_user');
            if (token && user) {
                try { JSON.parse(user); window.location.href = 'index.html'; }
                catch (e) { localStorage.removeItem('libra_token'); localStorage.removeItem('libra_user'); }
            }
        })();

        // ─── PARTICLES ───────────────────────────────────────
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor() { this.reset(true); }
            reset(init = false) {
                this.x = Math.random() * canvas.width;
                this.y = init ? Math.random() * canvas.height : canvas.height + 10;
                this.size = Math.random() * 2.5 + 0.5;
                this.speed = Math.random() * 0.5 + 0.1;
                this.drift = (Math.random() - 0.5) * 0.3;
                this.life = 0;
                this.maxLife = Math.random() * 250 + 120;
                this.maxAlpha = Math.random() * 0.3 + 0.05;
                this.alpha = 0;
                const h = 210 + Math.random() * 40;
                const s = 65 + Math.random() * 30;
                this.color = `hsla(${h}, ${s}%, 45%, `;
            }
            update() {
                this.y -= this.speed; this.x += this.drift; this.life++;
                const half = this.maxLife / 2;
                this.alpha = this.life < half
                    ? (this.life / half) * this.maxAlpha
                    : ((this.maxLife - this.life) / half) * this.maxAlpha;
                if (this.life >= this.maxLife || this.y < -10) this.reset();
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `${this.color}1)`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `${this.color}0.5)`;
                ctx.fill();
                ctx.restore();
            }
        }

        const particles = [];
        for (let i = 0; i < 80; i++) particles.push(new Particle());
        (function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        })();

        // ─── FLOATING BG ICONS ───────────────────────────────
        const bgBooks = document.getElementById('bg-books');
        ['fa-book', 'fa-book-open', 'fa-bookmark', 'fa-scroll', 'fa-book-atlas'].forEach(icon => {
            for (let j = 0; j < 3; j++) {
                const el = document.createElement('i');
                el.className = `fa-solid ${icon} bg-book`;
                el.style.left = `${5 + Math.random() * 90}%`;
                el.style.fontSize = `${16 + Math.random() * 28}px`;
                el.style.animationDuration = `${12 + Math.random() * 20}s`;
                el.style.animationDelay = `${-Math.random() * 28}s`;
                bgBooks.appendChild(el);
            }
        });

        // ─── RANDOM THOUGHTS ─────────────────────────────────
        const thoughts = [
            { quote: '"A reader lives a thousand lives before he dies. The man who never reads lives only one."', author: '— George R.R. Martin' },
            { quote: '"Not all those who wander are lost — some are between the shelves."', author: '— J.R.R. Tolkien (Adapted)' },
            { quote: '"Books are a uniquely portable magic."', author: '— Stephen King' },
            { quote: '"The more that you read, the more things you will know. The more you learn, the more places you will go."', author: '— Dr. Seuss' },
            { quote: '"A library is not a luxury but one of the necessities of life."', author: '— Henry Ward Beecher' },
        ];
        const thoughtQuoteEl = document.getElementById('thought-quote');
        const thoughtAuthorEl = document.getElementById('thought-author');

        // ─── BOOK OPEN / CLOSE ───────────────────────────────
        const book = document.getElementById('book3d');
        const bookScene = document.querySelector('.book-scene');
        const btnAccess = document.getElementById('btn-access-website');
        const btnClose = document.getElementById('btn-close-book');
        const hintArrow = document.getElementById('hint-arrow');
        const coverFront = document.getElementById('book-cover-front');

        function openBook() {
            if (book.classList.contains('is-open')) return;
            // Pick a random thought
            const t = thoughts[Math.floor(Math.random() * thoughts.length)];
            thoughtQuoteEl.textContent = t.quote;
            thoughtAuthorEl.textContent = t.author;

            book.classList.add('is-open');
            bookScene.classList.add('book-open');
            btnClose.classList.add('visible');
            hintArrow.style.opacity = '0';
            coverFront.classList.add('no-hover');
        }

        function closeBook() {
            book.classList.remove('is-open');
            bookScene.classList.remove('book-open');
            btnClose.classList.remove('visible');
            hintArrow.style.opacity = '1';
            coverFront.classList.remove('no-hover');
        }

        // Click anywhere on the cover to open
        coverFront.addEventListener('click', (e) => {
            e.stopPropagation();
            openBook();
        });

        btnAccess.addEventListener('click', (e) => {
            e.stopPropagation();
            // ripple
            const rect = btnAccess.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            const ripple = document.createElement('span');
            ripple.className = 'ripple';
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
            ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
            btnAccess.appendChild(ripple);
            ripple.addEventListener('animationend', () => ripple.remove());
            setTimeout(openBook, 150);
        });

        btnClose.addEventListener('click', closeBook);

        // ─── API BASE URL ────────────────────────────────────
        const API_BASE = 'http://localhost:3000';

        // ─── ADMIN LOGIN ─────────────────────────────────────
        document.getElementById('admin-login-form').addEventListener('submit', async function (e) {
            e.preventDefault();
            const errorEl = document.getElementById('admin-error');
            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-password').value;
            errorEl.style.display = 'none';

            try {
                const res = await fetch(API_BASE + '/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    localStorage.setItem('libra_token', data.token);
                    localStorage.setItem('libra_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    errorEl.textContent = data.message || 'Invalid credentials.';
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = 'Server error. Please try again.';
                errorEl.style.display = 'block';
            }
        });

        // ─── GOOGLE LOGIN (Firebase) ─────────────────────────
        document.getElementById('google-login-btn').addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await firebase.auth().signInWithPopup(provider);
                const user = result.user;

                // Sync with your backend
                const res = await fetch(API_BASE + '/api/auth/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: user.email,
                        name: user.displayName,
                        photoURL: user.photoURL
                    })
                });
                const data = await res.json();
                if (data.success && data.token) {
                    localStorage.setItem('libra_token', data.token);
                    localStorage.setItem('libra_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                } else {
                    alert(data.message || 'Login failed. Please try again.');
                }
            } catch (err) {
                console.error('Google login error:', err);
                if (err.code !== 'auth/popup-closed-by-user') {
                    alert('Google sign-in failed: ' + err.message);
                }
            }
        });

        // ─── DEV STUDENT LOGIN ────────────────────────────────
        document.getElementById('dev-student-login').addEventListener('click', async () => {
            try {
                const res = await fetch(API_BASE + '/api/auth/dev-student-login', { method: 'POST' });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('libra_token', data.token);
                    localStorage.setItem('libra_user', JSON.stringify(data.user));
                    window.location.href = 'index.html';
                }
            } catch (err) { console.error('Dev login error:', err); }
        });
    </script>
</body>

</html>
